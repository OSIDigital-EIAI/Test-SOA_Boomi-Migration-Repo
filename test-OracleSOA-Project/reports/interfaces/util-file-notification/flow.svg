<svg viewBox="0 0 508 412" width="100%" style="max-width:508px;height:auto;display:block;margin:0 auto" role="img" aria-label="Flow diagram: FileNotification" font-family="Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif"><title>Flow diagram: FileNotification</title><defs><marker id="osimt-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs><path d="M 254 72 V 124" fill="none" stroke="var(--line)" stroke-width="1.5" marker-end="url(#osimt-flow-arrow)"/><path d="M 254 180 V 206 H 126 V 232" fill="none" stroke="var(--line)" stroke-width="1.5" marker-end="url(#osimt-flow-arrow)"/><text x="190" y="201" text-anchor="middle" font-size="11" fill="var(--muted)">sent</text><path d="M 254 180 V 206 H 382 V 232" fill="none" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#osimt-flow-arrow)"/><text x="318" y="201" text-anchor="middle" font-size="11" fill="var(--muted)">error</text><path d="M 126 288 V 314 H 254 V 340" fill="none" stroke="var(--line)" stroke-width="1.5" marker-end="url(#osimt-flow-arrow)"/><path d="M 382 288 V 314 H 254 V 340" fill="none" stroke="var(--line)" stroke-width="1.5" marker-end="url(#osimt-flow-arrow)"/><rect x="144" y="16" width="220" height="56" rx="28" fill="var(--sunk)" stroke="var(--ok)" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="var(--ink)"><title>Receive file notification — SOAP one-way process(Email, Subject, FilePath)</title><tspan x="254" y="48">Receive file notification</tspan></text><rect x="144" y="124" width="220" height="56" rx="10" fill="var(--sunk)" stroke="var(--line)" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="var(--ink)"><title>Attach file, send email — Gmail SMTP 587, empty body, file attached</title><tspan x="254" y="156">Attach file, send email</tspan></text><rect x="16" y="232" width="220" height="56" rx="10" fill="var(--sunk)" stroke="var(--line)" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="var(--ink)"><title>Delete sent file — Only when send returned Success</title><tspan x="126" y="264">Delete sent file</tspan></text><rect x="272" y="232" width="220" height="56" rx="10" fill="var(--sunk)" stroke="var(--bad)" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="var(--ink)"><title>Log error only — Exception caught and audited; file kept</title><tspan x="382" y="264">Log error only</tspan></text><rect x="144" y="340" width="220" height="56" rx="28" fill="var(--sunk)" stroke="var(--ok)" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="var(--ink)"><title>Callback empty result — processResponse always sent</title><tspan x="254" y="372">Callback empty result</tspan></text></svg>